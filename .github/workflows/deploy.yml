# Deploys the server to Supabase on every push that touches supabase/: database, then functions,
# then points the Telegram bot at the new function. Skips itself until the SUPABASE_ACCESS_TOKEN secret is set.
# The bot shares the «Відгуки» Supabase project, so it never runs `db push` (that would clash with the other repo's
# migration history) and deploys only its own two functions by name. Its SQL is idempotent and runs on every deploy.
name: Deploy server

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency: deploy

env:
  PROJECT_REF: "obpmsgxanigythxkvrmh"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Ready?
        id: check
        run: |
          if [[ "$PROJECT_REF" == __* || -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::notice::Сервер ще не налаштований (немає секрету SUPABASE_ACCESS_TOKEN). Пропускаю."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: 2.120.0
      - name: Database changes
        if: steps.check.outputs.ready == 'true'
        run: |
          for f in supabase/migrations/*.sql; do
            # The every-minute job calls this project's own bot function.
            sql=$(sed "s/__PROJECT_REF__/$PROJECT_REF/g" "$f")
            jq -n --arg q "$sql" '{query: $q}' | curl -fsS -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "content-type: application/json" \
              --data @- > /dev/null
            echo "applied $f"
          done
      - name: Functions
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy asystent asystent-api --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Connect the Telegram bot
        if: steps.check.outputs.ready == 'true'
        run: |
          out=$(curl -sS "https://$PROJECT_REF.supabase.co/functions/v1/asystent?setup=1")
          echo "::notice title=Bot::$out"
