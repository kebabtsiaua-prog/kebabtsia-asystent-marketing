# Deploys the server to Supabase on every push that touches supabase/: database, then functions,
# then points the Telegram bot at the new function. Skips itself until PROJECT_REF and two repository secrets are set:
# SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD (README → «Секрети»).
name: Deploy server

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency: deploy

env:
  PROJECT_REF: "__PROJECT_REF__"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Ready?
        id: check
        run: |
          if [[ "$PROJECT_REF" == __* || -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::notice::Сервер ще не налаштований (адреса проєкту або секрети GitHub). Пропускаю."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: 2.120.0
      - name: Link project
        if: steps.check.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Database changes
        if: steps.check.outputs.ready == 'true'
        run: |
          # The every-minute job calls this project's own bot function.
          sed -i "s/__PROJECT_REF__/$PROJECT_REF/g" supabase/migrations/*.sql
          supabase db push --include-all
      - name: Functions
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Connect the Telegram bot
        if: steps.check.outputs.ready == 'true'
        run: |
          out=$(curl -sS "https://$PROJECT_REF.supabase.co/functions/v1/asystent?setup=1")
          echo "::notice title=Bot::$out"
