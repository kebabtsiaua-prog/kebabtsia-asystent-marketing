# Renders the weekly PDF reports Claude queues in the database (as_outbox rows with a report and no file yet).
# Runs every hour and on demand; it only installs the browser when there is something to render.
# Logs show ids and sizes only: this repo is public and the reports are not.
name: Render reports

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:

concurrency: zvity

env:
  PROJECT_REF: "obpmsgxanigythxkvrmh"

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Anything to render?
        id: check
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then echo "n=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(curl -fsS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "content-type: application/json" \
            --data '{"query":"select count(*)::int n from as_outbox where file_b64 is null and report is not null"}' | jq '.[0].n')
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "to render: $n"
      - uses: actions/checkout@v4
        if: steps.check.outputs.n != '0'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.n != '0'
        with:
          node-version: 22
      - name: Browser
        if: steps.check.outputs.n != '0'
        run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Render
        if: steps.check.outputs.n != '0'
        run: node scripts/zvity-server.mjs
