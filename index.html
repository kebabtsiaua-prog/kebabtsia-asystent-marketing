<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кебабця Маркетинг Асистент</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Background and text follow the Telegram theme; the accent is Kebabtsia's teal. Status colours work in both themes. */
:root{
  --bg:var(--tg-theme-secondary-bg-color,#eef2f1); --card:var(--tg-theme-bg-color,#ffffff);
  --ink:var(--tg-theme-text-color,#172524); --muted:var(--tg-theme-hint-color,#6c7a78);
  --line:color-mix(in srgb,var(--muted) 22%,transparent); --soft:color-mix(in srgb,var(--muted) 12%,transparent);
  --accent:#0f7c80; --accent-ink:#ffffff; --accent-soft:color-mix(in srgb,#0f7c80 14%,transparent);
  --ok:#23864a; --warn:#b26b00; --bad:#c43b2f;
  --nav:#172524; --nav-ink:#ffffff;
  --r-card:24px; --r-tile:20px; --r-in:14px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:var(--tg-theme-secondary-bg-color,#0f1515); --card:var(--tg-theme-bg-color,#1a2222);
  --ink:var(--tg-theme-text-color,#e8efee); --muted:var(--tg-theme-hint-color,#8d9b99);
  --accent:#4db5bb; --accent-ink:#0b1c1d; --accent-soft:color-mix(in srgb,#4db5bb 18%,transparent);
  --ok:#5fd08a; --warn:#f2b54a; --bad:#ff7e70;
  --nav:#253131; --nav-ink:#e8efee; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.42 -apple-system,system-ui,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
/* In fullscreen Telegram draws its own buttons over the top of the page; it reports their height in --tg-*-safe-area-inset-top. */
.app{max-width:560px;margin:0 auto;padding:calc(12px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right)) calc(112px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.hi{min-width:0;display:flex;align-items:center;gap:10px}
.hi small{display:block;color:var(--muted);font-size:13px}
.hi b{display:block;font-size:21px;letter-spacing:-.01em;line-height:1.2}
.hbtns{display:flex;gap:8px;flex:none}
.round{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;flex:none}
.round svg{width:20px;height:20px}
.close{border:0;background:var(--card);border-radius:21px;padding:0 14px;height:42px;font-weight:600;font-size:14px;white-space:nowrap}
.demo{background:color-mix(in srgb,var(--warn) 16%,transparent);border-radius:var(--r-in);padding:8px 12px;font-size:13px}
.err{background:color-mix(in srgb,var(--bad) 15%,transparent);border-radius:var(--r-in);padding:8px 12px;font-size:13px}
.card{background:var(--card);border-radius:var(--r-card);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column;gap:8px}
h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:6px 4px 0;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 button{border:0;background:none;color:var(--accent);text-transform:none;letter-spacing:0;font-size:13px;font-weight:700;padding:0}
.empty{text-align:center;color:var(--muted);padding:22px 12px;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.note{text-align:center;color:var(--muted);font-size:12px;padding:2px 8px}
/* Focus */
.focus{background:var(--accent);color:var(--accent-ink);border-radius:var(--r-card);padding:18px;display:flex;flex-direction:column;gap:10px}
.focus .ftag{align-self:flex-start;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--accent-ink) 18%,transparent);padding:3px 11px;border-radius:999px}
.focus .big{font-size:21px;line-height:1.22;font-weight:700;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.focus .why{font-size:13px;opacity:.88}
.focus .row{display:flex;gap:8px;flex-wrap:wrap}
.focus .row button{border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px}
.focus .main{background:var(--accent-ink);color:var(--accent)}
.focus .ghost{background:color-mix(in srgb,var(--accent-ink) 18%,transparent);color:var(--accent-ink)}
/* Week */
.week{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{display:block}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-variant-numeric:tabular-nums}
.wk{min-width:0}
.wk h3{margin:0;font-size:16px}
.wk p{margin:2px 0 10px;color:var(--muted);font-size:13px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:0;background:transparent;border-radius:999px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);min-width:0}
.day b{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.day i{width:5px;height:5px;border-radius:50%;background:transparent}
.day.tail i{background:var(--bad)} .day.full i{background:var(--ok)}
.day.on{background:var(--accent);color:var(--accent-ink)} .day.on b{color:var(--accent-ink)}
/* KPI */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:var(--r-tile);padding:14px;display:flex;flex-direction:column;gap:3px;min-width:0;border:0;text-align:left}
.kpi .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.kpi .num{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.12}
.kpi .num small{font-size:14px;color:var(--muted);font-weight:600;margin-left:2px}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi.alert .num{color:var(--bad)}
.delta{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.delta.up{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.delta.down{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
/* Timeline */
.ti{display:grid;grid-template-columns:46px 14px 1fr;gap:8px;align-items:start;padding:8px 0}
.ti .t{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;padding-top:1px}
.ti .t small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.ti .rail{position:relative;align-self:stretch;display:flex;justify-content:center}
.ti .rail::before{content:"";position:absolute;top:10px;bottom:-18px;width:2px;background:var(--line)}
.ti:last-child .rail::before{display:none}
.ti .rail i{position:relative;width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);background:var(--card);margin-top:4px}
.ti.done .rail i{background:var(--ok);border-color:var(--ok)}
.ti.late .rail i{border-color:var(--bad)}
.ti.done .txt{color:var(--muted);text-decoration:line-through}
.ti .body{min-width:0}
.ti .txt{overflow-wrap:anywhere}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.acts .pill{padding:6px 11px;font-size:12.5px}
.pill{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.do{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pill.big{padding:13px;font-size:15px;width:100%}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.warn{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
/* Tabs with counters */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:0 -2px}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:var(--card);border-radius:999px;padding:9px 15px;font-weight:600;font-size:14px;white-space:nowrap;display:flex;gap:7px;align-items:center;flex:none}
.seg button span{font-size:12px;background:var(--soft);border-radius:999px;padding:0 7px;min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.seg button.on{background:var(--ink);color:var(--card)}
.seg button.on span{background:var(--accent);color:var(--accent-ink)}
.task{background:var(--card);border-radius:var(--r-tile);padding:14px;display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;border:0;text-align:left;width:100%}
.task .box{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:1px}
.task.done .box{background:var(--ok);border-color:var(--ok)}
.task.done .name{color:var(--muted);text-decoration:line-through}
.task .name{overflow-wrap:anywhere}
.task .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.task.plain{grid-template-columns:1fr}
/* Відгуки */
.point{background:var(--card);border-radius:var(--r-tile);padding:14px;display:flex;flex-direction:column;gap:6px;border:2px solid transparent}
.point.bad{border-color:var(--bad)}
.point .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.point .head b{font-size:15px;min-width:0}
.point .who{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;background:var(--bg);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
.alertrow{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.alertrow:first-of-type{border-top:0}
.alertrow .txt{overflow-wrap:anywhere}
/* Звіти */
.bars{display:flex;align-items:flex-end;gap:8px;height:128px;margin-top:14px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted);min-width:0}
.bars i{width:100%;border-radius:10px 10px 6px 6px;background:var(--soft);display:block}
.bars i b{display:block;background:var(--accent);border-radius:inherit;width:100%}
.bars em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.bars .today{color:var(--ink);font-weight:700}
.pdf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.pdf:first-child{border-top:0}
.pdf small{display:block;color:var(--muted);font-size:12px}
.mem{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.mem:first-child{border-top:0}
.mem .txt{overflow-wrap:anywhere}
/* Bottom nav: a floating pill; the round «+» in the middle adds a reminder. */
nav{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;justify-content:center;pointer-events:none;z-index:5}
.navbar{pointer-events:auto;background:var(--nav);border-radius:32px;padding:6px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;gap:2px;width:100%;max-width:528px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.navbar button{border:0;background:transparent;color:var(--nav-ink);opacity:.62;border-radius:26px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;min-width:0}
.navbar button svg{width:22px;height:22px}
.navbar button.on{opacity:1;background:color-mix(in srgb,var(--nav-ink) 12%,transparent)}
.navbar .plus{opacity:1}
.navbar .plus span{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.navbar .plus svg{width:24px;height:24px;display:block}
/* Sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:8}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px max(16px,env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h3{margin:0;font-size:18px;overflow-wrap:anywhere}
.sheet .ctx{font-size:13px;color:var(--muted)}
.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .row .pill{padding:12px;font-size:14px;white-space:normal}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-in);padding:11px;width:100%}
textarea{min-height:70px;resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));z-index:7;background:var(--ink);color:var(--card);border-radius:18px;padding:11px 12px 11px 16px;display:flex;gap:14px;align-items:center;font-size:14px;width:max-content;max-width:calc(100% - 32px)}
.toast span{overflow-wrap:anywhere}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:700;flex:none}
@media (prefers-reduced-motion: no-preference){.sheet>div{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

function call(action, args) {

    .then(function (r) { return r.json(); })
    .then(function (j) { if (j.error) throw new Error(j.error); return j; });
}
function run(action, args) {

function loadVidguky() {

function ring(pct) {

    (pct > 0 ? '<circle cx="42" cy="42" r="' + r + '" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + (c * Math.min(pct, 100) / 100).toFixed(1) + " " + c.toFixed(1) + '" transform="rotate(-90 42 42)"/>' : "") + "</svg>";
}
function weekCard(t) {
  if (!t || !t.week) return '<div class="card"><div class="empty"><b>Trello ще не підтягнуто</b>Оновлюю о 8:00, 14:00 і 18:00.</div></div>';
  var w = t.week, pct = w.total ? Math.round(w.done * 100 / w.total) : 0, today = dayKey(new Date());
  var days = w.days.map(function (d) {
    var cls = d.date === today ? "on" : d.total && d.done < d.total && d.date < today ? "tail" : d.total && d.done === d.total ? "full" : "";
    return '<button type="button" class="day ' + cls + '" data-day="' + esc(d.date) + '">' + esc(d.label) + "<b>" + (d.date ? Number(d.date.slice(8)) : "") + "</b><i></i></button>";
  }).join("");
  return '<div class="card week"><div class="ring">' + ring(pct) + "<b>" + pct + '%</b></div><div class="wk"><h3>Тиждень ' + esc(w.label) + "</h3><p>" + w.done + " з " + plural(w.total, "задачі", "задач", "задач") + ' у Trello закрито</p><div class="days">' + days + "</div></div></div>";
}
function waiting() { return (state.open || []).filter(function (r) { return r.status === "sent"; }); }

// What to look at first: a reminder waiting for «Зроблено», a complaint without a decision, the oldest tail, then the next reminder.
function focusCard() {
  var w = waiting(), t = state.trello, now = Date.now();

    var r = w[0];
    return focusHtml("Чекає «Зроблено»", r.text, "Нагадування з " + hm(new Date(r.due_at)) + (w.length > 1 ? ", і ще " + (w.length - 1) + " чекають." : ". Бот нагадуватиме щогодини, поки не позначиш."),
      '<button type="button" class="main" data-act="done" data-id="' + r.id + '">✓ Зроблено</button><button type="button" class="ghost" data-act="snooze" data-to="hour" data-id="' + r.id + '">+1 година</button>');
  }

  $("date").textContent = longDate(new Date());
  $("back").hidden = !SUB[name];
  if (TG && TG.BackButton) { if (SUB[name]) TG.BackButton.show(); else TG.BackButton.hide(); }
  if (name === "vidguky" || name === "today") loadVidguky();
  if (changed) window.scrollTo(0, 0);
}
function goBack() { show("today"); }
if (TG && TG.BackButton) TG.BackButton.onClick(goBack);

// ---------- Toast with «Скасувати»: the action waits 4 s, so undo needs no server call ----------
var pending = null;
function toast(text, undo) {
  var old = document.querySelector(".toast"); if (old) old.remove();
  var el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status");
  el.innerHTML = "<span>" + esc(text) + "</span>" + (undo ? '<button type="button">Скасувати</button>' : "");
  document.body.appendChild(el);
  if (undo) el.querySelector("button").onclick = function () { undo(); el.remove(); };
  setTimeout(function () { el.remove(); }, undo ? 4000 : 2500);
}
function later(action, args, label) {
  if (pending) { clearTimeout(pending.timer); pending.go(); }
  var row = document.querySelector('[data-rid="' + args.id + '"]');
  if (row) row.style.opacity = ".4";
  var p = { go: function () { pending = null; run(action, args).catch(function () {}); } };
  p.timer = setTimeout(p.go, 4000);
  pending = p;
  haptic("success");
  toast(label, function () { clearTimeout(p.timer); pending = null; if (row) row.style.opacity = ""; });
}

// ---------- Sheets ----------
function sheet(html) {
  $("layer").innerHTML = '<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div><span class="grab"></span>' + html + "</div></div>";
  var f = $("layer").querySelector("textarea,input:not([type=hidden])"); if (f && !TG) f.focus();
}
function closeSheet() { $("layer").innerHTML = ""; }
var REPEATS = [["", "Без повтору"], ["щодня", "Щодня"], ["щопонеділка", "Щопонеділка"], ["щовівторка", "Щовівторка"], ["щосереди", "Щосереди"], ["щочетверга", "Щочетверга"], ["щоп'ятниці", "Щопʼятниці"], ["щосуботи", "Щосуботи"], ["щонеділі", "Щонеділі"], ["1-го числа", "1-го числа щомісяця"]];
function addSheet(text) {
  sheet('<h3>Нове нагадування</h3><form id="addForm" class="stack"><label for="aText">Про що нагадати<textarea id="aText" placeholder="Відправити пуш акції тижня">' + esc(text || "") + '</textarea></label>' +
    '<div class="row"><label for="aDate">Дата<input type="date" id="aDate" value="' + dayKey(new Date()) + '"></label><label for="aTime">Час<input type="time" id="aTime" value="10:00"></label></div>' +
    '<label for="aRepeat">Повтор<select id="aRepeat">' + REPEATS.map(function (r) { return '<option value="' + r[0] + '">' + r[1] + "</option>"; }).join("") + "</select></label>" +
    '<button class="pill do big" type="submit">Поставити нагадування</button></form>');
}
function planSheet() {
  var rows = (state.open || []).map(function (r) {
    var d = new Date(r.due_at);
    return '<div class="ti' + (r.status === "sent" ? " late" : "") + '"><div class="t">' + hm(d) + "<small>" + dm(d) + '</small></div><div class="rail"><i></i></div><div class="body"><div class="txt">' + esc(r.text) + "</div>" + (r.repeat ? '<div class="note" style="text-align:left;padding:0">Повтор: ' + esc(r.repeat) + "</div>" : "") +
      '<div class="acts"><button type="button" class="pill" data-act="cancel" data-id="' + r.id + '">Скасувати</button></div></div></div>';
  }).join("");
  sheet("<h3>Весь план · " + (state.open || []).length + "</h3>" + (rows || '<div class="empty">Відкритих нагадувань немає.</div>'));
}

// ---------- Clicks ----------
document.addEventListener("click", function (ev) {
  var b = ev.target.closest("button,[data-close]");
  if (!b) return;
  if (b.id === "back") { goBack(); return; }
  if (b.hasAttribute("data-close")) { closeSheet(); return; }
  if (b.dataset.go) { closeSheet(); show(b.dataset.go); return; }
  if (b.dataset.tab) { taskTab = b.dataset.tab; show("tasks"); return; }
  if (b.dataset.sheet === "add") { addSheet(); return; }
  if (b.dataset.sheet === "plan") { planSheet(); return; }
  if (b.dataset.sheet === "more") {
    sheet('<h3>Ще</h3><div class="list"><button type="button" class="task plain" data-go="memory"><span><span class="name"><b>Памʼять</b></span><span class="meta"><span class="tag">' + plural(state.memory.length, "факт", "факти", "фактів") + '</span></span></span></button>' +
      '<button type="button" class="task plain" data-go="history"><span><span class="name"><b>Історія нагадувань</b></span><span class="meta"><span class="tag ok">зроблено ' + state.month.done + '</span><span class="tag bad">пропущено ' + state.month.missed + "</span><span class=\"tag\">цього місяця</span></span></span></button></div>");
    return;
  }
  if (b.dataset.act) {
    var id = Number(b.dataset.id), r = (state.open || []).concat(state.closed || []).filter(function (x) { return x.id === id; })[0];
    var label = b.dataset.act === "done" ? "Зроблено" : b.dataset.act === "cancel" ? "Скасовано" : b.dataset.to === "tomorrow" ? "Перенесено на завтра" : "Нагадаю через годину";
    closeSheet();
    later(b.dataset.act, { id: id, to: b.dataset.to }, label + (r ? ": " + r.text.slice(0, 32) + (r.text.length > 32 ? "…" : "") : ""));
    return;
  }
  if (b.dataset.task) {
    var t = taskLists()[taskTab][Number(b.dataset.task)];
    var url = state.trello && state.trello.board_url;
    sheet("<h3>" + esc(t.name) + '</h3><div class="ctx">' + esc(t.tag) + (t.project ? " · проєкт у Claude" : " · дошка «Мої задачі Кебабця»") + "</div>" +
      (t.next && t.next !== "—" ? '<div class="ctx">Далі: ' + esc(t.next) + "</div>" : "") +
      '<div class="row"><button type="button" class="pill do" data-remind="today" data-text="' + esc(t.name) + '">Нагадати сьогодні о 18:00</button><button type="button" class="pill" data-remind="tomorrow" data-text="' + esc(t.name) + '">Нагадати завтра о 10:00</button></div>' +
      (url && !t.project ? '<a class="pill big" style="text-align:center;text-decoration:none;color:inherit" href="' + esc(url) + '" target="_blank" rel="noopener">Відкрити в Trello ↗</a>' : ""));
    return;
  }
  if (b.dataset.remind) {
    var tom = b.dataset.remind === "tomorrow", day = dayKey(new Date(Date.now() + (tom ? 864e5 : 0)));
    closeSheet();
    run("add", { text: b.dataset.text, date: day, time: tom ? "10:00" : "18:00", repeat: "" }).then(function () { haptic("success"); toast(tom ? "Нагадаю завтра о 10:00" : "Нагадаю сьогодні о 18:00"); }).catch(function () {});
    return;
  }
  if (b.dataset.day) {
    var d = state.trello && state.trello.week.days.filter(function (x) { return x.date === b.dataset.day; })[0];
    if (d) toast(d.label + ": закрито " + d.done + " з " + d.total);
    return;
  }
  if (b.dataset.report) {
    b.disabled = true; b.textContent = "Надсилаю…";
    run("report_send", { id: Number(b.dataset.report) }).then(function () { haptic("success"); toast("PDF надіслано в чат з ботом"); }).catch(function () {});
    return;
  }
  if (b.dataset.mem) {
    var i = Number(b.dataset.i), m = state.memory[i];
    if (b.dataset.mem === "del") {
      if (b.dataset.confirm === "1") run("memory_delete", { topic: m.topic }).catch(function () {});
      else { b.dataset.confirm = "1"; b.textContent = "Точно видалити?"; }
      return;
    }
    m = b.dataset.mem === "edit" ? m : { topic: "", fact: "" };
    sheet("<h3>" + (m.topic ? "Змінити запис" : "Новий запис") + '</h3><form id="memForm" class="stack"><input type="hidden" id="mOld" value="' + esc(m.topic) + '"><label for="mTopic">Тема<input id="mTopic" value="' + esc(m.topic) + '"></label><label for="mFact">Факт<textarea id="mFact">' + esc(m.fact) + '</textarea></label><button class="pill do big" type="submit">Зберегти</button></form>');
  }
});

document.addEventListener("submit", function (e) {
  e.preventDefault();
  if (e.target.id === "addForm") {
    var text = $("aText").value, date = $("aDate").value, time = $("aTime").value, repeat = $("aRepeat").value;
    run("add", { text: text, date: date, time: time, repeat: repeat }).then(function () { closeSheet(); haptic("success"); toast("Поставив нагадування на " + time); }).catch(function () {});
  }
  if (e.target.id === "memForm") {
    run("memory_save", { topic: $("mTopic").value, fact: $("mFact").value, old: $("mOld").value }).then(function () { closeSheet(); toast("Збережено"); }).catch(function () {});
  }
});
document.addEventListener("change", function (e) { if (e.target.id === "aRepeat") $("aDate").disabled = !!e.target.value; });

$("demo").hidden = !DEMO;
run("overview").catch(function () { $("screen").innerHTML = ""; });
</script>
