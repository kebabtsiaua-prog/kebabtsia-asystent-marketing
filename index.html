<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кебабця Маркетинг Асистент</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Design system: «лайм». Unbounded for screen titles and big numbers, Manrope for everything else.
   Type 40 / 28–32 / 17 / 15 / 13 on an 8 px grid. Status colours are fixed: red overdue, amber waits for you, lime done, grey plan. */
:root{
  --bg:#eef0ea;--card:#ffffff;--ink:#141613;--muted:#5f645b;--line:#e6e8e1;--soft:#f4f5f1;--box:#a9ada3;
  --accent:#c6f432;--on-accent:#141a05;--link:#3f5c00;
  --dark:#141613;--dark2:#232622;--dark-line:#33372f;--on-dark:#f3f5ee;--dark-muted:#a3a89c;
  --red:#e0483f;--red-bg:#fbe5e3;--red-ink:#a32b2b;
  --amb:#e2a33a;--amb-bg:#fbf0d9;--amb-ink:#7f520e;
  --lime-bg:#eaf7c4;--lime-ink:#3f5c00;
  --grey-bg:#eef0ea;--grey-ink:#5f645b;
  --head:"Unbounded",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
[data-theme=dark]{
  --bg:#0e0f0d;--card:#1a1c19;--ink:#f1f3ec;--muted:#9a9f93;--line:#2a2d28;--soft:#222520;--box:#5c6157;
  --link:#c6f432;--dark:#232622;--dark2:#2d312b;--dark-line:#3b4037;
  --red-bg:#3a1d1a;--red-ink:#ff9f97;--amb-bg:#3a2c14;--amb-ink:#f2c46d;--lime-bg:#2a3510;--lime-ink:#c6f432;--grey-bg:#262923;--grey-ink:#a3a89c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--link)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--link);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- Shell ---------- */
.side{display:none}
.main{padding:calc(16px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right)) calc(104px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top .tt{flex:1 1 240px;min-width:0}
.eyebrow{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
h1{font:600 24px/1.2 var(--head);margin:6px 0 0;letter-spacing:-.01em;text-wrap:balance}
.upd{font-size:13px;color:var(--muted);font-weight:600}
.close{border:0;background:var(--card);border-radius:12px;padding:0 14px;height:40px;font-weight:700;font-size:14px;white-space:nowrap}
.back{border:0;background:var(--card);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.note-demo{background:var(--amb-bg);color:var(--amb-ink);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600}
.err{background:var(--red-bg);color:var(--red-ink);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600}
.cols{display:flex;flex-direction:column;gap:16px}
.colL,.colR{display:flex;flex-direction:column;gap:16px;min-width:0}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--dark);display:flex;padding:8px 6px calc(10px + env(safe-area-inset-bottom))}
.tabbar button{flex:1 1 0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#9ea397;font-size:11px;font-weight:700;height:52px;position:relative;min-width:0}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:22px;height:22px}
.tb{position:absolute;top:2px;left:50%;margin-left:6px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ---------- Blocks ---------- */
.card{background:var(--card);border-radius:18px;padding:18px}
.chead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.h2{font-size:17px;font-weight:800;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.link{border:0;background:none;padding:0;font-size:14px;font-weight:700;color:var(--link);text-decoration:none;margin-left:auto;white-space:nowrap}
.num{font:600 32px/1 var(--head);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:16px 0 4px;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:0 8px}

.row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit}
.chead+.row,.row.first{border-top:0}
button.row:hover{background:var(--soft)}
.row .body{flex:1;min-width:0}
.t{font-size:15px;line-height:1.4;font-weight:600;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--muted);margin-top:3px;display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
.chk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--box);background:var(--card);flex:none;margin-top:1px;display:grid;place-items:center}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk svg{width:14px;height:14px}
.row.done .t{color:var(--muted);text-decoration:line-through}
.dotA{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px;background:var(--amb)}
.ptime{font-weight:800;font-size:14px;width:72px;flex:none;font-variant-numeric:tabular-nums}
.ptime.w{width:96px}

.pill{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.p-red{background:var(--red-bg);color:var(--red-ink)}
.p-amb{background:var(--amb-bg);color:var(--amb-ink)}
.p-lime{background:var(--lime-bg);color:var(--lime-ink)}
.p-grey{background:var(--grey-bg);color:var(--grey-ink)}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--muted)}

.btn{min-height:44px;padding:0 18px;border-radius:12px;font:700 15px var(--body);border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn svg{width:18px;height:18px}
.b-lime{background:var(--accent);color:var(--on-accent)}
.b-line{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.b-ghost{background:transparent;color:var(--on-dark);border:1.5px solid #4a4e47}
.b-wide{width:100%}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btns .btn{flex:1 1 140px}

.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex;gap:2px}
.bar i{display:block;height:100%}

/* Focus: one dark block per screen */
.focus{background:var(--dark);color:var(--on-dark);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px}
.focus .pills{display:flex;gap:6px;flex-wrap:wrap}
.f-main{background:var(--accent);color:var(--on-accent)}
.f-red{background:#4a1f1c;color:#ffb4ad}
.f-amb{background:#45351a;color:#f6cf86}
.ftitle{font:600 21px/1.25 var(--head);margin:0;letter-spacing:-.01em;overflow-wrap:anywhere;text-wrap:balance}
.fdesc{font-size:14px;line-height:1.5;color:#c9cdc3;margin:8px 0 0}
.pushbox{background:var(--dark2);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.pushbox .pb{flex:1 1 220px;min-width:0}
.pushbox b{display:block;font-size:15px}
.pushbox span{display:block;font-size:14px;color:#c9cdc3;margin-top:4px;line-height:1.45}
.copy{height:36px;padding:0 12px;border-radius:10px;border:1.5px solid #4a4e47;background:transparent;color:var(--on-dark);font:700 13px var(--body);flex:none}
.focus .link{color:var(--accent)}
.fnext{border-top:1px solid var(--dark-line);padding-top:14px;font-size:13.5px;color:var(--dark-muted)}

/* Week strip */
.days{display:flex;gap:2px;margin:10px 0 4px}
.day{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.day.today{color:var(--ink);background:var(--soft)}
.day.late{background:var(--red-bg);color:var(--red-ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.plan{background:transparent;border:2px solid var(--ink)}
.dot.sent{background:var(--accent)}
.dot.late{background:var(--red)}

/* Tabs and chips */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:var(--card);border-radius:999px;height:40px;padding:0 16px;font-weight:700;font-size:14px;white-space:nowrap;display:flex;gap:8px;align-items:center;flex:none}
.seg button span{font-size:12px;background:var(--soft);border-radius:999px;padding:0 7px;min-width:22px;text-align:center}
.seg button.on{background:var(--dark);color:var(--on-dark)}
.seg button.on span{background:var(--accent);color:var(--on-accent)}
.seg button{flex:1 0 auto;justify-content:center;padding:0 12px}
[data-theme=dark] .seg button.on{background:var(--accent);color:var(--on-accent)}
[data-theme=dark] .seg button.on span{background:var(--on-accent);color:var(--accent)}
.card>.row:first-child,.card>div>.row:first-child{border-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;height:32px;padding:0 12px;font-size:13px;font-weight:700;color:var(--muted)}
.chip.on{border-color:var(--ink);color:var(--ink)}
.grp{display:flex;align-items:center;gap:8px;padding:16px 0 4px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.grp:first-of-type{padding-top:4px}

/* Push window */
.flabel{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:16px 0 6px}
.fval{font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.steps{margin:0;padding-left:20px;font-size:14.5px;line-height:1.6}
.texts{background:var(--soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;margin-top:16px}
.texts .ln{display:flex;gap:10px;align-items:flex-start}
.cnt{font-size:11px;font-weight:800;padding:2px 6px;border-radius:5px;flex:none;margin-top:2px;font-variant-numeric:tabular-nums}
.cnt.ok{background:var(--lime-bg);color:var(--lime-ink)}
.cnt.over{background:var(--red-bg);color:var(--red-ink)}
.grid2{display:grid;grid-template-columns:1fr;gap:0 24px}
.tl{display:flex;flex-direction:column}
.tl .st{display:flex;gap:12px;align-items:flex-start;padding:7px 0;font-size:14px}
.tl .st i{width:10px;height:10px;border-radius:50%;border:2px solid var(--box);flex:none;margin-top:5px}
.tl .st.past i{background:var(--box);border-color:var(--box)}
.tl .st.now i{background:var(--red);border-color:var(--red)}
.tl .st.past{color:var(--muted)}
.tl .st b{font-variant-numeric:tabular-nums;width:92px;flex:none}
.chart{display:flex;align-items:flex-end;gap:6px;height:140px;margin-top:16px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:11px;color:var(--muted);font-weight:700;min-width:0}
.chart i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--ink)}
.chart em{font-style:normal;color:var(--ink);font-size:11px;font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}

/* Sheets, forms, toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:8}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h3{margin:0;font:600 19px/1.3 var(--head);overflow-wrap:anywhere}
.sheet .ctx{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.sheet .box{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px;overflow-wrap:anywhere}
.sheet .box small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
input,select,textarea{font:600 16px var(--body);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 14px;height:48px;width:100%}
textarea{height:auto;min-height:80px;padding:12px 14px;resize:vertical;font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:10;background:var(--ink);color:var(--card);border-radius:14px;padding:12px 14px 12px 16px;display:flex;gap:14px;align-items:center;font-size:14px;font-weight:600;width:max-content;max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:800;flex:none}
[data-theme=dark] .toast{background:#f1f3ec;color:#141613}[data-theme=dark] .toast button{color:#3f5c00}
@media (prefers-reduced-motion:no-preference){.sheet>div{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.5}}}

/* Reviews */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .k{font-size:13px;font-weight:700;color:var(--muted)}
.kpi .num{font-size:28px}
.kpi .num.bad{color:var(--red)}

/* ---------- Laptop ---------- */
@media (min-width:960px){
  .tabbar{display:none}
  .side{display:flex;position:fixed;top:0;bottom:0;left:0;width:248px;background:var(--dark);color:var(--on-dark);padding:calc(28px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)) 16px 24px;flex-direction:column;gap:4px;overflow:auto;z-index:5}
  .brand{display:flex;align-items:center;gap:12px;padding:0 12px 28px}
  .logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--on-accent);font:600 17px var(--head);display:grid;place-items:center;flex:none}
  .bname{font-size:15px;font-weight:800;line-height:1.2}
  .bsub{font-size:12px;color:#9ea397;font-weight:600}
  .nav{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;color:#c9cdc3;border:0;background:transparent;font-size:15px;font-weight:600;text-align:left;width:100%}
  .nav:hover{color:#fff;background:#232622}
  .nav.on{background:var(--accent);color:var(--on-accent)}
  .nav svg{width:20px;height:20px;flex:none}
  .badge{margin-left:auto;font-size:12px;font-weight:800;min-width:24px;text-align:center;padding:2px 8px;border-radius:999px;background:#2a2d29;color:var(--on-dark)}
  .nav.on .badge{background:rgba(20,26,5,.14);color:var(--on-accent)}
  .badge.red{background:var(--red);color:#fff}
  .nsep{height:1px;background:#2a2d29;margin:12px}
  .newbtn{margin-top:auto;min-height:48px;border-radius:14px;border:1.5px dashed #4a4e47;background:transparent;color:var(--on-dark);font:700 15px var(--body)}
  .main{margin-left:248px;padding:calc(40px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)) 48px 56px}
  .wrap{gap:24px}
  h1{font-size:32px;line-height:1.15;margin-top:8px}
  .eyebrow{font-size:13px}
  .cols{flex-direction:row;align-items:flex-start;gap:24px}
  .colL{flex:2 1 0;gap:24px}.colR{flex:1 1 0;gap:24px;min-width:300px}
  .card{padding:24px;border-radius:20px}
  .focus{padding:32px;border-radius:24px;gap:20px}
  .ftitle{font-size:30px;line-height:1.2}
  .fdesc{font-size:15px;max-width:620px}
  .num{font-size:40px}
  .grid2{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:repeat(4,1fr);gap:16px}
  .sheet{top:0;align-items:center;padding-left:248px}
  .sheet>div{border-radius:24px;max-width:560px;padding:28px 28px 28px}
  .grab{display:none}
  .toast{bottom:32px;left:calc(50% + 124px)}
}
@media (min-width:1420px){.main{padding-left:calc(48px + (100vw - 248px - 1216px) / 2)}}
</style>
</head>
<body>
<nav class="side" aria-label="Розділи">
  <div class="brand"><div class="logo">К</div><div><div class="bname">Кебабця</div><div class="bsub">Маркетинг Асистент</div></div></div>
  <div id="sidenav"></div>
  <div class="nsep"></div>
  <button class="newbtn" type="button" data-sheet="add">+ Нове нагадування</button>
</nav>

<div class="main"><div class="wrap">
  <div class="top">
    <button class="back" id="back" type="button" aria-label="Назад" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="tt"><div class="eyebrow" id="eyebrow"></div><h1 id="title">Завантажую…</h1></div>

  <div id="err" class="err" role="alert" hidden></div>
  <main id="screen"></main>
</div></div>

<nav class="tabbar" id="tabbar" aria-label="Розділи"></nav>
<div id="layer"></div>

<script>

var state = null, vid = null, vLoaded = 0;

function nagTimes(dueIso) {

  function at(dk, hh, mm, plusDays) { var base = new Date(dk + "T12:00:00Z"); base = new Date(base.getTime() + (plusDays || 0) * 864e5); return kyivTime(base.toISOString().slice(0, 10), hh, mm); }

  var evening = at(day, 20, 0, 0);
  for (var t = due.getTime() + 30 * 6e4, k = 0; t <= evening; t += 120 * 6e4, k++) out.push({ at: t, label: k ? "ще раз" : "через 30 хв" });

// ---------- Toast with «Скасувати»: the action waits 4 s ----------
var pending = null;
function toast(text, undo) {
  var old = document.querySelector(".toast"); if (old) old.remove();
  var el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status");
  el.innerHTML = "<span>" + esc(text) + "</span>" + (undo ? '<button type="button">Скасувати</button>' : "");
  document.body.appendChild(el);
  if (undo) el.querySelector("button").onclick = function () { undo(); el.remove(); };
  setTimeout(function () { el.remove(); }, undo ? 4000 : 2600);
}
function later(action, args, label) {
  if (pending) { clearTimeout(pending.timer); pending.go(); }
  var p = { go: function () { pending = null; run(action, args).catch(function () {}); } };
  p.timer = setTimeout(p.go, 4000);
  pending = p;
  haptic("success");
  toast(label, function () { clearTimeout(p.timer); pending = null; });
}

  sheet("<h3>Перенести пуш №" + num + '</h3><div class="ctx">Нагадування почнуться заново під нову дату.</div><form id="moveForm" data-num="' + num + '" style="display:flex;flex-direction:column;gap:14px"><div class="pair"><label for="mvDate">Дата<input type="date" id="mvDate" value="' + (dayKey(d) > dayKey(new Date()) ? dayKey(d) : tomorrow) + '"></label><label for="mvTime">Час<input type="time" id="mvTime" value="' + hm(d) + '"></label></div><button class="btn b-lime b-wide" type="submit">Перенести</button></form>');
}
function uploadSheet(num) {
  var opts = pushes().filter(function (p) { return p.status === "sent" || pushState(p)[0] !== "off"; }).sort(byDue).reverse();
  sheet('<h3>Додати файл uployal</h3><div class="ctx">Експорт групи з uployal (.xlsx або .csv), можна кілька файлів одразу. Імена й телефони не зберігаю: лише зашифрований ID, групу, кількість чеків і дату останньої покупки.</div>' +
    '<form id="upForm" style="display:flex;flex-direction:column;gap:14px"><label for="upNum">До якого пушу<select id="upNum">' + opts.map(function (p) { return '<option value="' + p.num + '"' + (p.num === num ? " selected" : "") + ">№" + p.num + " · " + esc(p.segment).slice(0, 48) + "</option>"; }).join("") + "</select></label>" +
    '<label for="upKind">Що це за файл<select id="upKind"><option value="sent">Кому пішов пуш (до)</option><option value="check">Свіжий експорт для перевірки (після)</option></select></label>' +
    '<label for="upFile">Файли<input type="file" id="upFile" multiple accept=".xlsx,.xls,.csv" style="padding-top:12px"></label><div class="ctx" id="upInfo"></div>' +
    '<button class="btn b-lime b-wide" type="submit" id="upBtn">Зберегти</button></form>');
}
function checkSheet(num) {
  var p = pushes().filter(function (x) { return x.num === num; })[0]; if (!p) return;
  var files = (state.push.files || []).filter(function (f) { return f.push_num === num; });
  var has = function (k) { return files.some(function (f) { return f.kind === k; }); };
  sheet("<h3>Перевірка №" + num + '</h3><div class="ctx">' + esc(p.segment) + " · " + (p.check_on ? dm(new Date(p.check_on + "T12:00:00Z")) : "") + "</div>" +
    '<div class="box"><small>Кроки</small>1. Файл «кому пішов пуш»: ' + (has("sent") ? "є ✓" : "ще немає") + "<br>2. У день перевірки свіжий експорт тих самих груп: " + (has("check") ? "є ✓" : "ще немає") + "<br>3. Порахую, хто купив знову після пушу.</div>" +
    '<div id="cmp"></div><div class="btns"><button class="btn b-line" type="button" data-sheet="upload" data-num="' + num + '">Додати файл</button>' + (has("sent") && has("check") ? '<button class="btn b-lime" type="button" data-compare="' + num + '">Порахувати повернення</button>' : "") + "</div>");
}
function projSheet(n) {
  var r = projectRows().filter(function (x) { return x.n === n; })[0]; if (!r) return;
  sheet("<h3>" + esc(r.name) + '</h3><div class="ctx"><span class="pill ' + r.st[3] + '">' + r.st[2].toLowerCase() + "</span> · проєкт у Claude</div>" +
    (r.done ? '<div class="box"><small>Зроблено</small>' + esc(r.done) + "</div>" : "") + (r.next ? '<div class="box"><small>Далі</small>' + esc(r.next) + "</div>" : "") +
    '<div class="btns"><button type="button" class="btn b-lime" data-remind="today" data-text="' + esc(r.name) + '">Нагадати о 18:00</button><button type="button" class="btn b-line" data-remind="tomorrow" data-text="' + esc(r.name) + '">Завтра о 10:00</button></div>' +
    '<div class="foot" style="text-align:left">Відкрити, написати й додати проєкт прямо звідси буде в Етапі 3.</div>');
}
function taskSheet(key) {
  var k = key.split(":"), t = trello(), item = k[0] === "today" ? todayItems()[+k[1]] : k[0] === "tails" ? t.tails[+k[1]] : t.main[+k[1]];
  if (!item) return;
  var ctx = k[0] === "today" ? "Сьогодні · " + (t.today ? t.today.card : "") : k[0] === "tails" ? "Хвіст з картки " + esc(item.card || "") + " · " + plural(daysSince(item.since), "день", "дні", "днів") : esc(item.card || "Головне");
  sheet("<h3>" + esc(item.name) + '</h3><div class="ctx">' + ctx + " · " + esc(dirOf(item.name)) + "</div>" +
    '<div class="btns"><button type="button" class="btn b-lime" data-remind="today" data-text="' + esc(item.name) + '">Нагадати о 18:00</button><button type="button" class="btn b-line" data-remind="tomorrow" data-text="' + esc(item.name) + '">Завтра о 10:00</button></div>' +
    (t.board_url ? '<a class="btn b-line b-wide" href="' + esc(t.board_url) + '" target="_blank" rel="noopener">Відкрити в Trello ↗</a>' : "") +
    '<div class="foot" style="text-align:left">Галочка звідси прямо в Trello запрацює після Етапу 2, коли підключимо ключ Trello.</div>');
}
function remSheet(id) {
  var r = (state.open || []).filter(function (x) { return x.id === id; })[0]; if (!r) return;
  sheet("<h3>" + esc(r.text) + '</h3><div class="ctx">' + dm(new Date(r.due_at)) + " о " + hm(new Date(r.due_at)) + (r.repeat ? " · " + esc(r.repeat) : "") + "</div>" +
    '<div class="btns"><button class="btn b-lime" type="button" data-act="done" data-id="' + id + '">' + ICON.check + 'Зроблено</button><button class="btn b-line" type="button" data-act="snooze" data-to="hour" data-id="' + id + '">+1 година</button><button class="btn b-line" type="button" data-act="snooze" data-to="tomorrow" data-id="' + id + '">Завтра</button></div>');
}
function moreSheet() {
  sheet('<h3>Ще</h3><div>' + [["vidguky", "Відгуки", "скарги й оцінки по точках"], ["reports", "Звіти", "тиждень і PDF"], ["memory", "Памʼять", plural(state.memory.length, "факт", "факти", "фактів")], ["history", "Історія нагадувань", "зроблено " + state.month.done + ", пропущено " + state.month.missed + " цього місяця"]].map(function (x, i) {
    return '<button type="button" class="row' + (i ? "" : " first") + '" data-go="' + x[0] + '">' + ICON[x[0]].replace("<svg", '<svg width="22" height="22"') + '<span class="body"><span class="t">' + x[1] + '</span><span class="sub">' + esc(x[2]) + "</span></span></button>";
  }).join("") + '</div><button class="btn b-lime b-wide" type="button" data-sheet="add">+ Нове нагадування</button>');
}

// ---------- uployal files: read in the browser, keep only four columns, hash the id ----------
function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  return new Promise(function (ok, bad) { var s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = ok; s.onerror = function () { bad(new Error("Не вдалося завантажити читалку Excel")); }; document.head.appendChild(s); });
}
function pickCol(head, res) { for (var r = 0; r < res.length; r++) for (var i = 0; i < head.length; i++) if (res[r].test(String(head[i] || ""))) return i; return -1; }
function toDate(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number" && v > 20000 && v < 80000) return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
  var s = String(v).trim(), m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/);
  if (m) return m[3] + "-" + m[2].padStart(2, "0") + "-" + m[1].padStart(2, "0");
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[0];
  var d = new Date(s); return isNaN(d) ? null : d.toISOString().slice(0, 10);
}
function sha(s) { return crypto.subtle.digest("SHA-256", new TextEncoder().encode("kebabtsia:" + s)).then(function (b) { return Array.from(new Uint8Array(b)).slice(0, 10).map(function (x) { return x.toString(16).padStart(2, "0"); }).join(""); }); }
// CSV from uployal can use «;», «,» or tabs; the delimiter is taken from the first line.
function parseCsv(text) {
  text = text.replace(/^\uFEFF/, "");
  var first = text.split(/\r?\n/)[0], sep = [";", "\t", ","].sort(function (a, b) { return first.split(b).length - first.split(a).length; })[0];
  var rows = [], row = [], cell = "", q = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function readFile(file) {
  var csv = /\.csv$/i.test(file.name);
  return (csv ? file.text() : file.arrayBuffer()).then(function (data) {
    var rows;
    if (csv) rows = parseCsv(data);
    else { var wb = XLSX.read(data, { type: "array" }); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: "" }); }
    var hi = 0; for (var i = 0; i < Math.min(rows.length, 10); i++) if (rows[i].filter(function (c) { return c !== ""; }).length >= 2) { hi = i; break; }
    var head = rows[hi].map(function (h) { return String(h).toLowerCase(); });
    var ci = pickCol(head, [/^id$|ід|id клієнт|код клієнт|client.?id|uid/i, /телефон|phone|номер/i, /карт/i]);
    var cg = pickCol(head, [/rfm|груп|сегмент|group/i]);
    var cc = pickCol(head, [/чек|покуп|кол.?во|кількість|orders|frequency|частот/i]);
    var cl = pickCol(head, [/послед|остан|last|давн/i]);
    if (ci < 0) throw new Error("У файлі «" + file.name + "» не знайшов колонки з ID або телефоном клієнта");
    var fg = (file.name.match(/(?:^|\D)([1-3]{3})(?:\D|$)/) || [])[1] || "";
    var body = rows.slice(hi + 1).filter(function (r) { return String(r[ci]).trim() !== ""; });
    return Promise.all(body.map(function (r) { return sha(String(r[ci]).replace(/\D/g, "") || String(r[ci]).trim()); })).then(function (ids) {
      return body.map(function (r, k) { var c = cc >= 0 ? parseInt(String(r[cc]).replace(/\s/g, ""), 10) : NaN; return { i: ids[k], g: cg >= 0 ? String(r[cg]).trim() : fg, c: isNaN(c) ? null : c, l: cl >= 0 ? toDate(r[cl]) : null }; });
    });
  });
}

// ---------- Clicks ----------
function copyPush(num) {
  var p = pushes().filter(function (x) { return x.num === num; })[0]; if (!p) return;
  var text = p.title + "\n" + p.body;
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { haptic("success"); toast("Скопійовано заголовок і текст"); }, function () { toast("Не вдалося скопіювати, виділи текст вручну"); });
}
document.addEventListener("click", function (ev) {
  var b = ev.target.closest("button,[data-close]");
  if (!b || b.type === "submit") return;
  var ds = b.dataset;
  if (b.id === "back") { goBack(); return; }
  if (b.hasAttribute("data-close")) { closeSheet(); return; }
  if (ds.go) { closeSheet(); show(ds.go); return; }
  if (ds.tab) { closeSheet(); taskTab = ds.tab; taskDir = ""; show("tasks", current === "tasks"); return; }
  if (ds.dir != null) { taskDir = ds.dir; show("tasks", true); return; }
  if (ds.sheet === "add") { addSheet(); return; }
  if (ds.sheet === "plan") { planSheet(); return; }
  if (ds.sheet === "more") { moreSheet(); return; }
  if (ds.sheet === "upload") { var last = pushes().filter(function (x) { return x.status === "sent"; }).sort(byDue).pop(); uploadSheet(Number(ds.num) || (last || nextPush() || {}).num); return; }
  if (ds.push) { pushSheet(Number(ds.push)); return; }
  if (ds.copy) { copyPush(Number(ds.copy)); return; }
  if (ds.sent) { sentSheet(Number(ds.sent)); return; }
  if (ds.count) { sentSheet(Number(ds.count)); return; }
  if (ds.move) { moveSheet(Number(ds.move)); return; }
  if (ds.check) { checkSheet(Number(ds.check)); return; }
  if (ds.proj) { projSheet(ds.proj); return; }
  if (ds.task) { taskSheet(ds.task); return; }
  if (ds.rem) { remSheet(Number(ds.rem)); return; }
  if (ds.delfile) {
    if (ds.confirm === "1") run("push_file_delete", { id: Number(ds.delfile) }).then(function () { toast("Файл видалено"); }).catch(function () {});
    else { ds.confirm = "1"; b.textContent = "Точно?"; }
    return;
  }
  if (ds.compare) {
    b.disabled = true; b.textContent = "Рахую…";
    call("push_compare", { num: Number(ds.compare) }).then(function (r) {
      $("cmp").innerHTML = '<div class="box"><small>Результат</small><span class="num" style="font-size:28px">' + one(r.pct) + "%</span> повернулися: " + thousands(r.back) + " з " + thousands(r.n) + "<br>" +
        Object.keys(r.groups).sort().map(function (g) { var x = r.groups[g]; return esc(g) + ": " + x.back + " з " + x.n + " (" + (x.n ? one(x.back * 100 / x.n) : "0") + "%)"; }).join(" · ") + "</div>";
      b.textContent = "Пораховано";
    }).catch(function (e) { b.disabled = false; b.textContent = "Порахувати повернення"; $("cmp").innerHTML = '<div class="err">' + esc(e.message) + "</div>"; });
    return;
  }
  if (ds.act) {
    var id = Number(ds.id), r = (state.open || []).concat(state.closed || []).filter(function (x) { return x.id === id; })[0];
    var label = ds.act === "done" ? "Зроблено" : ds.act === "cancel" ? "Скасовано" : ds.to === "tomorrow" ? "Перенесено на завтра" : "Нагадаю через годину";
    closeSheet();
    later(ds.act, { id: id, to: ds.to }, label + (r ? ": " + r.text.slice(0, 32) + (r.text.length > 32 ? "…" : "") : ""));
    return;
  }
  if (ds.remind) {
    var tom = ds.remind === "tomorrow", day = dayKey(new Date(Date.now() + (tom ? 864e5 : 0)));
    closeSheet();
    run("add", { text: ds.text, date: day, time: tom ? "10:00" : "18:00", repeat: "" }).then(function () { haptic("success"); toast(tom ? "Нагадаю завтра о 10:00" : "Нагадаю сьогодні о 18:00"); }).catch(function () {});
    return;
  }
  if (ds.report) {
    b.disabled = true; b.textContent = "Надсилаю…";
    run("report_send", { id: Number(ds.report) }).then(function () { haptic("success"); toast("PDF надіслано в чат з ботом"); }).catch(function () {});
    return;
  }
  if (ds.mem) {
    var i = Number(ds.i), m = state.memory[i];
    if (ds.mem === "del") {
      if (ds.confirm === "1") run("memory_delete", { topic: m.topic }).catch(function () {});
      else { ds.confirm = "1"; b.textContent = "Точно видалити?"; }
      return;
    }
    m = ds.mem === "edit" ? m : { topic: "", fact: "" };
    sheet("<h3>" + (m.topic ? "Змінити запис" : "Новий запис") + '</h3><form id="memForm" style="display:flex;flex-direction:column;gap:14px"><input type="hidden" id="mOld" value="' + esc(m.topic) + '"><label for="mTopic">Тема<input id="mTopic" value="' + esc(m.topic) + '"></label><label for="mFact">Факт<textarea id="mFact">' + esc(m.fact) + '</textarea></label><button class="btn b-lime b-wide" type="submit">Зберегти</button></form>');
  }
});

document.addEventListener("submit", function (e) {
  e.preventDefault();
  var f = e.target;
  if (f.id === "addForm") {
    run("add", { text: $("aText").value, date: $("aDate").value, time: $("aTime").value, repeat: $("aRepeat").value }).then(function () { closeSheet(); haptic("success"); toast("Поставив нагадування на " + $("aTime").value); }).catch(function () {});
  }
  if (f.id === "memForm") run("memory_save", { topic: $("mTopic").value, fact: $("mFact").value, old: $("mOld").value }).then(function () { closeSheet(); toast("Збережено"); }).catch(function () {});
  if (f.id === "sentForm") {
    var num = Number(f.dataset.num), count = $("sentCount").value.trim();
    if (count && !/^[\d\s]+$/.test(count)) { $("err").textContent = "Кількість має бути числом"; $("err").hidden = false; return; }
    run("push_sent", { num: num, count: count }).then(function () { closeSheet(); haptic("success"); toast("Пуш №" + num + " позначено надісланим. Бот більше не нагадуватиме"); }).catch(function () {});
  }
  if (f.id === "moveForm") {
    var n2 = Number(f.dataset.num);
    run("push_move", { num: n2, date: $("mvDate").value, time: $("mvTime").value }).then(function () { closeSheet(); haptic("success"); toast("Пуш №" + n2 + " перенесено на " + $("mvDate").value.split("-").reverse().slice(0, 2).join(".") + " " + $("mvTime").value); }).catch(function () {});
  }
  if (f.id === "upForm") {
    var files = Array.from($("upFile").files || []);
    if (!files.length) { $("upInfo").textContent = "Обери файл"; return; }
    $("upBtn").disabled = true; $("upBtn").textContent = "Читаю файли…";
    (files.every(function (x) { return /\.csv$/i.test(x.name); }) ? Promise.resolve() : loadXlsx()).then(function () { return Promise.all(files.map(readFile)); }).then(function (parts) {
      var rows = [].concat.apply([], parts);
      $("upInfo").textContent = "Знайшов " + thousands(rows.length) + " клієнтів, зберігаю…";
      var name = files.length === 1 ? files[0].name : files.length + " файлів: " + files.map(function (x) { return x.name; }).join(", ");
      return run("push_file", { num: Number($("upNum").value), kind: $("upKind").value, name: name, rows: rows }).then(function () { closeSheet(); haptic("success"); toast("Збережено " + thousands(rows.length) + " клієнтів"); });
    }).catch(function (er) { $("upBtn").disabled = false; $("upBtn").textContent = "Зберегти"; $("upInfo").textContent = er.message; });
  }
});
document.addEventListener("change", function (e) { if (e.target.id === "aRepeat") $("aDate").disabled = !!e.target.value; });

$("demo").hidden = !DEMO;
var START = { push: 1, tasks: 1, projects: 1, vidguky: 1, reports: 1 }[location.hash.slice(1)] ? location.hash.slice(1) : "home";
current = START;
window.addEventListener("hashchange", function () { var h = location.hash.slice(1); if (screens[h] && state) { closeSheet(); show(h); } });
run("overview").catch(function () { $("screen").innerHTML = ""; });
</script>
